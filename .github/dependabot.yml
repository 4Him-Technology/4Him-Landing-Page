version: 2
updates:
  # Atualizações semanais de dependências npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
      include: "scope"
    # Bloqueia majors — só sugerimos minor/patch automaticamente.
    # Major bumps (React 19, Tailwind 4, Vite 8 etc.) precisam de revisão manual
    # porque costumam ter breaking changes.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      # Agrupa minor + patch num único PR (evita 1 PR por pacote)
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Atualizações de GitHub Actions (se vier a ter workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
