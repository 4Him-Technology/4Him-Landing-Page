[build]
  publish = "dist"
  command = "npm run build"

# ─── Security headers (todas as páginas) ───
[[headers]]
  for = "/*"
  [headers.values]
    # Força HTTPS por 1 ano em todos os subdomínios
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

    # Bloqueia MIME sniffing
    X-Content-Type-Options = "nosniff"

    # Bloqueia carregar a página em iframe (anti-clickjacking)
    X-Frame-Options = "DENY"

    # XSS legacy (browsers antigos)
    X-XSS-Protection = "1; mode=block"

    # Vaza só a origem em requests cross-origin
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Desliga APIs sensíveis (câmera, mic, geo, pagamento, etc.)
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), accelerometer=(), gyroscope=(), interest-cohort=()"

    # Content-Security-Policy removido temporariamente — estava bloqueando recursos do site

# ─── Cache agressivo para assets versionados (Vite hash) ───
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ─── Imagens estáticas: cache de 1 dia ───
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ─── HTML nunca é cacheado (sempre serve a versão mais nova) ───
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ─── SPA fallback: rotas inexistentes voltam para index.html ───
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
